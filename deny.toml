# cargo-deny configuration. Run with `cargo deny check`; CI runs it too.

[graph]
# btrealloc only builds for Linux, so leave out Windows-only dependencies.
targets = ["x86_64-unknown-linux-gnu", "aarch64-unknown-linux-gnu"]

[advisories]
# Defaults: deny vulnerabilities and unmaintained crates from RustSec.

[licenses]
# Permissive licenses compatible with btrealloc's MIT license.
allow = ["MIT", "Apache-2.0", "Apache-2.0 WITH LLVM-exception", "Unicode-3.0"]

[bans]
multiple-versions = "warn"

[sources]
unknown-registry = "deny"
unknown-git = "deny"

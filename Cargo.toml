[package]
name = "btrealloc"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"

[dependencies]
clap = { version = "4.6.6", features = ["derive"] }
linux-raw-sys = { version = "0.12.1", default-features = false, features = ["btrfs", "ioctl", "general", "std"] }
sha2 = "0.11.0"

# The end to end suite needs root, for the search ioctl as much as for the mkfs
# and loop mount every test does. `cargo test` leaves it alone; run it with
# `cargo test --test vm`, or in the VM with `nix flake check`.
[[test]]
name = "vm"
path = "tests/vm.rs"
test = false

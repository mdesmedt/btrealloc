name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  basic-tests:
    name: basic tests (${{ matrix.system }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - system: x86_64-linux
            runner: ubuntu-24.04
          - system: aarch64-linux
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - uses: DeterminateSystems/nix-installer-action@main

      - name: cargo fmt --check
        run: nix develop --command cargo fmt --check

      - name: cargo clippy
        run: nix develop --command cargo clippy --all-targets -- -D warnings

      - name: cargo build
        run: nix develop --command cargo build

      - name: cargo test
        run: nix develop --command cargo test

  # The VM suite run straight on the runner, as root, with no VM around it.
  # aarch64 runners have no /dev/kvm, so a VM there crawls under software
  # emulation, and this is the only end to end run it gets. On x86_64 it tests
  # the runner's own kernel alongside the VM's NixOS one.
  native-tests:
    name: native tests (${{ matrix.system }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - system: x86_64-linux
            runner: ubuntu-24.04
          - system: aarch64-linux
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: DeterminateSystems/nix-installer-action@main

      - name: Show the environment
        run: |
          uname -a
          ulimit -n
          free -h
          sudo modprobe btrfs
          grep btrfs /proc/filesystems

      # The same btrfs-progs the VM gets, from the flake's pinned nixpkgs.
      - name: Install btrfs-progs
        run: |
          nix build --inputs-from . "nixpkgs#btrfs-progs^out" --no-link --print-out-paths \
            | sed 's|$|/bin|' >> "$GITHUB_PATH"

      - name: Build the VM suite
        run: nix develop --command cargo test --release --test vm --no-run

      # Cargo runs the test binary through sudo. sudo resets PATH, so it is
      # passed along for mkfs.btrfs and btrfs from the step above.
      - name: Run the VM suite
        run: |
          nix develop --command bash -c '
            export CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_RUNNER="sudo env PATH=$PATH"
            export CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_RUNNER="sudo env PATH=$PATH"
            cargo test --release --test vm -- --test-threads=1
          '

  # x86_64 only: aarch64 runners have no /dev/kvm, and native-tests covers them.
  vm-tests:
    name: VM tests (x86_64-linux)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: DeterminateSystems/nix-installer-action@main

      # NixOS test VMs need /dev/kvm. The runner has it, but the device node
      # isn't world-accessible by default.
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # Run the VM
      - name: nix flake check
        run: nix flake check --print-build-logs

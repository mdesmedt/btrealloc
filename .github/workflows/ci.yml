name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  basic-tests:
    name: basic tests (${{ matrix.system }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - system: x86_64-linux
            runner: ubuntu-24.04
          - system: aarch64-linux
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - uses: DeterminateSystems/nix-installer-action@main

      - name: cargo fmt --check
        run: nix develop --command cargo fmt --check

      - name: cargo clippy
        run: nix develop --command cargo clippy --all-targets -- -D warnings

      - name: cargo build
        run: nix develop --command cargo build

      - name: cargo test
        run: nix develop --command cargo test

  # The VM suite run straight on the runner, as root, with no VM around it.
  # Trialled alongside vm-tests: aarch64 runners have no /dev/kvm, so there the
  # VM crawls under software emulation. This tests the runner's own kernel
  # rather than NixOS's.
  bare-tests:
    name: bare tests (${{ matrix.system }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - system: x86_64-linux
            runner: ubuntu-24.04
          - system: aarch64-linux
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: DeterminateSystems/nix-installer-action@main

      - name: Show the environment
        run: |
          uname -a
          ulimit -n
          free -h
          sudo modprobe btrfs
          grep btrfs /proc/filesystems

      # The same btrfs-progs the VM gets, from the flake's pinned nixpkgs.
      - name: Install btrfs-progs
        run: |
          nix build --inputs-from . "nixpkgs#btrfs-progs^out" --no-link --print-out-paths \
            | sed 's|$|/bin|' >> "$GITHUB_PATH"

      - name: Build the VM suite
        run: nix develop --command cargo test --release --test vm --no-run

      # Cargo runs the test binary through sudo. sudo resets PATH, so it is
      # passed along for mkfs.btrfs and btrfs from the step above.
      - name: Run the VM suite
        run: |
          nix develop --command bash -c '
            export CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_RUNNER="sudo env PATH=$PATH"
            export CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_RUNNER="sudo env PATH=$PATH"
            cargo test --release --test vm -- --test-threads=1
          '

  vm-tests:
    name: VM tests (${{ matrix.system }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - system: x86_64-linux
            runner: ubuntu-24.04
          - system: aarch64-linux
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      # aarch64 runners have no /dev/kvm, so Nix's auto-detected
      # system-features never includes "kvm" and it refuses to even schedule
      # the build (which unconditionally requires it). Claiming the feature
      # anyway is safe: the VM test script itself checks for /dev/kvm at
      # runtime and only passes -enable-kvm when it's actually present,
      # falling back to software emulation otherwise.
      - uses: DeterminateSystems/nix-installer-action@main
        with:
          extra-conf: |
            extra-system-features = kvm

      # NixOS test VMs need /dev/kvm. On x86_64 runners the hardware/hypervisor
      # supports it but the device node isn't world-accessible by default. On
      # aarch64 runners the device doesn't exist at all (no nested
      # virtualization support), so the VM falls back to unaccelerated
      # (TCG) emulation instead, which is much slower but still works.
      - name: Enable KVM (if available)
        run: |
          if [ -e /dev/kvm ]; then
            echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
              | sudo tee /etc/udev/rules.d/99-kvm4all.rules
            sudo udevadm control --reload-rules
            sudo udevadm trigger --name-match=kvm
          else
            echo "No /dev/kvm on this runner; VM test will run without acceleration."
          fi

      # Run the VM
      - name: nix flake check
        run: nix flake check --print-build-logs

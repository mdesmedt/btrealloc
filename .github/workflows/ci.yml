name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  basic-tests:
    name: basic tests (${{ matrix.system }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - system: x86_64-linux
            runner: ubuntu-24.04
          - system: aarch64-linux
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - uses: DeterminateSystems/nix-installer-action@main

      - name: cargo fmt --check
        run: nix develop --command cargo fmt --check

      - name: cargo clippy
        run: nix develop --command cargo clippy --all-targets -- -D warnings

      - name: cargo build
        run: nix develop --command cargo build

      - name: cargo test
        run: nix develop --command cargo test

  vm-tests:
    name: VM tests (${{ matrix.system }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - system: x86_64-linux
            runner: ubuntu-24.04
          - system: aarch64-linux
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: DeterminateSystems/nix-installer-action@main

      # NixOS test VMs need /dev/kvm. On x86_64 runners the hardware/hypervisor
      # supports it but the device node isn't world-accessible by default. On
      # aarch64 runners the device doesn't exist at all (no nested
      # virtualization support), so the VM falls back to unaccelerated
      # (TCG) emulation instead, which is much slower but still works.
      - name: Enable KVM (if available)
        run: |
          if [ -e /dev/kvm ]; then
            echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
              | sudo tee /etc/udev/rules.d/99-kvm4all.rules
            sudo udevadm control --reload-rules
            sudo udevadm trigger --name-match=kvm
          else
            echo "No /dev/kvm on this runner; VM test will run without acceleration."
          fi

      # Run the VM
      - name: nix flake check
        run: nix flake check --print-build-logs
